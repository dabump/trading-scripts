# WARRIOR TRADING VARIANT -- branch test/warrior-comparison, under evaluation.
#
# The micro pullback as described at
# https://www.warriortrading.com/pull-back-trading-strategy/, applied in full so it
# can be paper-traded. Each difference from the measured baseline is commented at
# its key. Backtested results are in docs/decisions.md: over a year this variant
# ends at 9,890 against the baseline's 9,943, and is worse at every slippage level.
# It is on test because the backtest fills a buy-stop at its trigger price, which is
# the least realistic assumption in the comparison; live paper fills are the point.
#
# Do not merge to main on the strength of the backtest.
#
# Tunable strategy parameters. See docs/operations.md for the canonical table of
# these keys and which design doc each one comes from.
#
# Values marked PROPOSED were not finalized in the docs; they were filled in
# during implementation so the agent could run, and are listed in
# docs/decisions.md as pending your review. Change them freely.

market_data:
  # "sip" is the full consolidated tape (paid Algo Trader Plus); "iex" is the free
  # single-exchange feed carrying only a few percent of consolidated volume, on
  # which the relative-volume criterion below is not meaningful.
  feed: sip

screening:
  # Tradability floors, not momentum criteria. A 2024-2026 backtest of this strategy
  # found the screen dominated by warrants ($0.07), SPAC units averaging 15 shares a
  # day, and sub-$1 names trading a few hundred shares — none fillable at a sensible
  # price, and sub-$1 was also the worst-performing price bucket. PROPOSED values.
  min_price: 1.0
  # The band the strategy trades. Above roughly $20 a 10% move on 5x volume is a
  # different kind of event in a different kind of name, and the pullback entry below
  # is not what moves it. PROPOSED.
  max_price: 10.0
  min_dollar_volume: 1000000
  # A floor with deliberately no ceiling. A max_intraday_pct was tried and removed:
  # under the old profit-target/trailing-stop exits the widest gaps were the worst
  # trades, but once winners were allowed to run the extreme movers became the right
  # tail the strategy depends on, and capping at +50% cost about half the terminal
  # equity over a year. See docs/decisions.md.
  min_intraday_pct: 10.0 # docs/strategy.md §2
  min_volume_multiple: 5.0 # docs/strategy.md §2
  avg_volume_lookback_days: 20 # PROPOSED (docs left the lookback undecided)
  # The whole tradable universe is scanned each pass; this only bounds how many of
  # the symbols that clear min_intraday_pct get the expensive per-symbol lookups.
  max_enriched: 100 # PROPOSED
  # Must reach back past the market open: a gap-up's catalyst almost always breaks
  # overnight or pre-market, so searching only from 09:30 would miss it. 18h covers
  # the prior evening through this morning's pre-market. PROPOSED.
  news_lookback: 18h

# Extended hours: the 04:00-09:30 and 16:00-20:00 ET sessions. The same three
# screening criteria, run against a tape carrying a few percent of regular-session
# volume — which is why two of the numbers they are compared against have
# extended-hours counterparts here.
#
# Every value below is PROPOSED. Unlike the regular-session thresholds, none of these
# has been measured: cmd/backtest fetches 09:30-16:00 bars, so it has no extended-hours
# data to sweep. Treat an extended-hours run as an observation exercise before turning
# allow_entry on. See docs/decisions.md.
extended:
  # Screening and scanning outside the bells. Off means the agent behaves exactly as it
  # did before this section existed: MARKET_CLOSED until 09:30 and from 16:00, no
  # requests made.
  enabled: true
  # The whole pre-market session. US pre-market trading opens at 04:00 ET, and this
  # matches it so the agent's state never disagrees with what the exchange is doing —
  # an EXTENDED-MARKET badge that only appears for part of the period is worse than
  # none. A later start is a supported way to trim API calls, at the cost of being
  # blind to anything that has already moved by then.
  start: "04:00"
  # The end of the post-market session, 20:00 ET on a normal day. The book is flattened
  # eod_exit_offset_minutes before this, so nothing bought after the close is carried
  # overnight.
  #
  # It is a wall-clock time, which is wrong on a half day: the exchange shortens
  # post-market along with the session, and Alpaca's calendar reports only the regular
  # open and close, so there is nothing to derive the real extended close from. Orders
  # into a session that has ended simply do not fill, but the page will show
  # EXTENDED_MARKET through hours in which nothing trades.
  end: "20:00"
  # A separate key from timing.screener_scan_interval so extended hours can be scanned
  # less often, but currently set to the same 1m. One pass is ~130 mostly serial
  # requests, so 04:00-09:30 at this cadence is ~330 passes averaging ~130 requests a
  # minute against Alpaca's 200/min, with as many again after the close; 5m would be
  # ~66 passes at ~26 a minute. Nothing measures pass duration, so slowing this is the
  # cheap way to buy headroom.
  scan_interval: 1m
  # Replaces screening.min_dollar_volume during extended hours. The regular $1,000,000
  # floor is a regular-session number and rejects essentially every extended-hours name,
  # including the ones genuinely trading.
  min_dollar_volume: 100000
  # Replaces screening.min_volume_multiple during extended hours. The comparison is
  # unchanged — volume traded in this extended session against the 20-session daily
  # average — but an extended session is a fraction of a day, so 0.5x here is a far
  # more extreme reading than 5.0x is at 15:00.
  min_volume_multiple: 0.5
  # Buying outside the bells. Off by default, and deliberately a separate switch from
  # `enabled`: extended-hours entry fills from a thin book, and before the bell it runs
  # before the first-hour sentiment gate exists. The engine substitutes a live sentiment
  # read for the gate there, which is a weaker guarantee than the gate itself; after the
  # close the day's own verdict applies, so a halted day stays halted.
  allow_entry: true
  # Limit-price allowance on extended-hours orders, in percent. Extended-hours orders
  # are always limit orders — Alpaca accepts nothing else for those sessions — so
  # execution.order_type below governs the regular session only, and this governs
  # outside the bells.
  #
  # Wider than the regular 0.5% because extended-hours spreads on these names are
  # several times wider, and an order that never fills is the failure mode where the
  # feature looks enabled and silently does nothing. It applies to exits too, where not
  # filling is the worse direction: an unfilled extended-hours stop leaves the position
  # open. PROPOSED, and the first thing to watch if orders sit unfilled or fills come in
  # worse than expected. 0 falls back to execution.limit_slip_pct.
  limit_slip_pct: 1.0

# The setup gate: what a screened candidate has to print before it is bought. All
# PROPOSED — these are the mechanical reading of a discretionary pattern, and the
# numbers are the ones the strategy is usually described with, not measured optima.
entry:
  pattern_interval: 1m # the candle the setup is read on
  ema_period: 9 # the trend line price must hold above
  require_above_vwap: true # accumulation, not distribution
  # The setup is a micro pullback (docs/strategy.md §3): a surge to the high of day,
  # a 1-2 candle pause, then a close above the last pause candle's high. These values
  # are the ones measured in docs/decisions.md; they have not been tuned.
  max_pullback_bars: 3 # "usually just a 1-3 candle pause" (Warrior Trading)
  surge_bars: 3 # candles, ending just before the pause, that the surge spans
  min_surge_pct: 3.0 # rise across those candles, lowest low to the top
  max_retrace_pct: 50 # most of the surge's range the pause may give back
  # Enter on the BREAK of the pause high, intrabar, rather than waiting for a candle
  # to close above it. The engine arms the setup on each completed candle and fires on
  # whichever later tick price trades through the level; max_entry_drift_pct below is
  # what stops it chasing. Measured WORSE than the close trigger over a year (equity
  # 8,511 vs 9,943, and far worse on slippage) -- on test to see whether real fills
  # disagree with the backtest's assumption that a buy-stop fills at its trigger.
  buy_stop_entry: true
  require_macd: false # MACD(12,26,9) above its signal line
  require_volume_decline: true # pause lighter on volume than the surge
  stop_buffer_pct: 0.1 # placed just under the pullback low, not on it
  # Warrior places the stop just under the pullback low and sizes up on how tight that
  # is, so a tight stop is the point rather than a hazard. Effectively disabled.
  min_stop_distance_pct: 0.05
  # If the chart stop is further away than this, the trade is not taken at all. This
  # is part of the strategy rather than a safety rail: with risk that wide the size
  # has to shrink until the winner cannot pay for the losers.
  max_stop_distance_pct: 4.0
  # The setup is read on a closed candle, so by the time the order goes the price has
  # moved. Just before buying, the live price is re-read: the entry is refused if it is
  # at or under the stop, back under the pause high, more than this far above the
  # trigger close, or puts the stop outside the distance limits above. Size comes from
  # the live price. PROPOSED, unmeasured — docs/decisions.md 2026-10-03.
  max_entry_drift_pct: 1.0

risk:
  # Fixed risk per trade, not a fixed slice of the portfolio. The share count comes
  # from how far the stop is: shares = (equity x risk_per_trade_pct) / (entry - stop).
  # Sizing by portfolio fraction instead makes the dollar risk swing with the stock's
  # volatility, so a wide-stop trade quietly costs several times a tight-stop one.
  risk_per_trade_pct: 1.0
  # A cap on one position's notional regardless of how tight its stop is; without it a
  # stop 0.5% away would size to more than the whole account.
  #
  # It has to sit above risk_per_trade_pct / max_stop_distance_pct, or it binds on
  # every single trade and sizing quietly reverts to a fixed fraction of the account.
  # At 1% risk and a 4% maximum stop that ratio is 25%, so 33% leaves the risk rule in
  # charge for the wider setups. On a very tight stop the cap still binds and the trade
  # risks less than 1% — conservative, and worth knowing when reading the audit trail.
  max_position_pct: 33.0
  # Three, not five. The strategy being followed runs a small number of positions at
  # a time rather than a basket; five concurrent microcap momentum trades is a
  # different risk profile from the one it describes. Three at 33% also keeps maximum
  # exposure just under fully invested.
  max_concurrent_positions: 3
  stop_loss_pct: 10.0 # docs/risk.md
  allow_same_day_reentry: true # PROPOSED (docs left same-day re-entry undecided)

exit:
  # Scale out of a winner, keep a runner. The target is in multiples of the trade's
  # own initial risk, not a fixed percentage: a trade risking 2% and one risking 4%
  # should not take profit at the same price move.
  #
  # This is deliberately not the rule that was removed. A fixed +15% target arming a
  # 5% trailing stop could not exit above +9.25% while those positions went on to
  # average +53% -- over 1,697 trades it turned a per-trade mean of +0.18% into
  # -2.13% (t = -9.76). Selling a fraction and letting the rest run keeps the right
  # tail open, which is where this strategy's entire return lives. There is also no
  # MACD trigger: it fired on 24.9% of trades for a mean of -0.08%. See
  # docs/decisions.md. PROPOSED.
  first_target_r: 2.0 # ignored while first_target_cents is set
  # A fixed cash target, as the discretionary version states it. It is NOT
  # scale-invariant -- 12c is 6% of a $2 stock and 0.9% of a $14 one -- and over a
  # year its entire measured gain came from 16 trades in the $10-20 band, where it is
  # a near-instant scratch. Re-expressed as 1.0R or 0.5R the gain vanished. Held under
  # suspicion; max_price above now caps the band it exploited.
  first_target_cents: 0.12
  first_target_fraction: 0.75 # "sell 75% of my position into strength"
  breakeven_after_target: true
  eod_exit_offset_minutes: 5 # docs/strategy.md §4
  # The micro pullback's exit: sell on the first candle to trade below the previous
  # candle's low, by raising the stop to each completed candle's low. off |
  # after_target (the runner only) | always (from the entry candle). See
  # docs/decisions.md for how each measured.
  candle_trail: after_target # the runner is trailed on each completed candle's low once the target is banked

timing:
  sentiment_poll_interval: 2m # docs/strategy.md §1
  # Five minutes, not the hour originally specified. The kill switch is worth keeping,
  # but an hour of it meant sitting out the single most important hour of the day for
  # this strategy: the moves it looks for begin in the first fifteen minutes. 09:30
  # to 09:35 is still not tradeable, which is a real cost and a deliberate one.
  sentiment_window: 5m
  # New positions are only opened in this window after the open; positions already
  # held are still managed to the close. 5h55m from a 09:30 open reaches 15:25, which
  # is exactly where entry_cutoff_buffer puts the last entry ahead of the 15:55 forced
  # exit — so this covers the whole regular session the buffer allows and the buffer
  # below is the rule that binds. A longer value changes nothing: Bounds clamps it.
  #
  # Measured caveat, recorded in docs/decisions.md: on the backtested year, later
  # entries were worse. A 2h window ended at $8,871 against 4h at $7,162 and all-day
  # at $5,582 (t = -4.24). This value trades that away for the full session's
  # opportunity, which is a deliberate choice and not a measured improvement.
  entry_window: 5h55m
  # Quiet time between the last entry and the forced exit, so nothing is bought that
  # is about to be sold. Enforced against the forced-exit mark rather than assumed
  # from entry_window, so an early close tightens the window instead of collapsing
  # the gap.
  entry_cutoff_buffer: 30m
  screener_scan_interval: 1m # docs/strategy.md §2
  # How often open positions are re-marked and their exits evaluated. Also the
  # engine's tick interval — Run ticks at the shortest configured cadence — so each
  # tick's one account request and one batched snapshot run at this rate: ~60 requests
  # a minute at 2s, on top of the scan's ~130, against Alpaca's 200/min. Raise this
  # first if requests start being refused. PROPOSED.
  position_poll_interval: 2s

sentiment:
  # IWM is included because the strategy trades small caps; SPY/QQQ alone would
  # describe a different slice of the market than the one being traded.
  symbols: ["SPY", "QQQ", "IWM"]
  bearish_avg_pct: -0.8 # PROPOSED (docs left the thresholds undecided)
  require_all_negative: true # PROPOSED

execution:
  order_type: market # PROPOSED (docs left order type undecided)
  limit_slip_pct: 0.5 # only used when order_type is limit

web:
  listen_addr: ":8080"
  poll_interval: 12s # docs/web-ui.md: ~10-15s

storage:
  database_path: data/agent.db # docs/operations.md

audit:
  # Append-only JSON-lines trail of decisions and actions, one file per session
  # date. Separate from the operational log on stderr: this is the record you read
  # back weeks later to answer "why did it buy that?".
  directory: logs
